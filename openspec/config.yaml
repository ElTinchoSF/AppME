# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: vanilla HTML/CSS/JS sin build
  Architecture: offline-first, single-file IIFE + "use strict", lógica pura separada del DOM
  Testing: none (no test runner configured)
  Style: español neutro para artefactos técnicos, secciones comentadas en HTML

rules:
  proposal:
    - Include rollback plan for risky changes
    - Maintain offline-first constraint (no CDN, no build tooling)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Single HTML file with embedded CSS/JS
      - Vendored libs in lib/ directory
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Preserve offline-first constraint